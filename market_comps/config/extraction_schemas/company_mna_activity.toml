name = "company_mna_activity"
version = "v1"

description = "Extract mergers, acquisitions, and exit activity"

enabled = true
model_complexity = "medium"

[[fields]]
id = "company_name"
type = "string"
required = true
description = "The name of the company being analyzed"

# ----------------------------------------------------------------------------

[[fields]]
id = "acquisitions"
type = "text"
required = false
description = "A comma-separated list of companies acquired by this company"

# ----------------------------------------------------------------------------

[[fields]]
id = "potential_acquirers"
type = "text"
required = false
description = "A comma-separated list of potential strategic or sponsor acquirers"

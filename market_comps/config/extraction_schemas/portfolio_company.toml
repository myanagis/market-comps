name = "portfolio_company"
version = "v1"

description = "Extract details about a portfolio company and its relationship to an investment firm"

enabled = true
model_complexity = "medium"

[[fields]]
id = "company_name"
type = "string"
required = true
description = "The name of the portfolio company"

# ----------------------------------------------------------------------------

[[fields]]
id = "description"
type = "text"
required = false
description = "A brief description of the company"

# ----------------------------------------------------------------------------

[[fields]]
id = "industry"
type = "string"
required = false
description = "The industry or sector of the company"

# ----------------------------------------------------------------------------

[[fields]]
id = "website"
type = "string"
required = false
description = "The website URL of the portfolio company"

# ----------------------------------------------------------------------------

[[fields]]
id = "founded_year"
type = "integer"
required = false
description = "The year the company was founded"

# ----------------------------------------------------------------------------

[[fields]]
id = "investment_firm_name"
type = "string"
required = false
description = "The name of the investment firm, venture capital fund, or accelerator that invested in this company"

# ----------------------------------------------------------------------------

[[fields]]
id = "investment_date"
type = "string"
required = false
description = "The date or year of the investment"

name = "startup_pitch_deck"
version = "v1"
description = "Investor fundraising presentation for a startup company"
enabled = true
model_complexity = "medium"
[[fields]]
id = "company_name"
type = "string"
required = true
description = "The name of the startup company"

[[fields]]
id = "company_description"
type = "text"
required = false
description = "A short paragraph describing what the company does and its core value proposition"

[[fields]]
id = "industry"
type = "string"
required = false
description = "The primary industry or vertical the company operates in (e.g., SaaS, FinTech, Healthcare)"

[[fields]]
id = "founded_year"
type = "integer"
required = false
description = "The year the company was founded"

[[fields]]
id = "website"
type = "string"
required = false
description = "The company's website URL"

[[fields]]
id = "headquarters"
type = "string"
required = false
description = "The city and state/country where the company is headquartered"

[[fields]]
id = "target_market"
type = "string"
required = false
description = "A description of the company's target market or ideal customer profile"

[[fields]]
id = "tam_usd"
type = "currency"
required = false
description = "Total Addressable Market (TAM) size in USD, if mentioned"

[[fields]]
id = "sam_usd"
type = "currency"
required = false
description = "Serviceable Available Market (SAM) size in USD, if mentioned"

[[fields]]
id = "som_usd"
type = "currency"
required = false
description = "Serviceable Obtainable Market (SOM) size in USD, if mentioned"

[[fields]]
id = "competitors"
type = "text"
required = false
description = "A comma-separated list of key competitors mentioned in the document"

[[fields]]
id = "current_arr"
type = "currency"
required = false
description = "Current Annual Recurring Revenue (ARR) or run rate"

[[fields]]
id = "gross_margin_percent"
type = "float"
required = false
description = "Current or target gross margin percentage (e.g., 75.0)"

[[fields]]
id = "monthly_burn_rate"
type = "currency"
required = false
description = "Average monthly cash burn rate"

[[fields]]
id = "runway_months"
type = "integer"
required = false
description = "Months of runway remaining based on current cash and burn"

[[fields]]
id = "ltv_cac_ratio"
type = "float"
required = false
description = "LTV to CAC ratio, if mentioned"

[[fields]]
id = "round_name"
type = "string"
required = false
description = "The name of the current funding round (e.g., Pre-Seed, Seed, Series A)"

[[fields]]
id = "target_amount_usd"
type = "currency"
required = false
description = "The target amount the company is looking to raise in USD"

[[fields]]
id = "pre_money_valuation_usd"
type = "currency"
required = false
description = "The pre-money valuation of the company in USD, if mentioned"

[[fields]]
id = "lead_investor"
type = "string"
required = false
description = "The lead investor for the round, if mentioned"

[[fields]]
id = "use_of_funds"
type = "text"
required = false
description = "Summary of how the company plans to use the raised funds"

[[fields]]
id = "founders"
type = "array"
description = "List of founders of the company"

  [[fields.items]]
  id = "first_name"
  type = "string"
  description = "Founder's first name"
  
  [[fields.items]]
  id = "last_name"
  type = "string"
  description = "Founder's last name"

  [[fields.items]]
  id = "email"
  type = "string"
  description = "Founder's email address, if mentioned"

  [[fields.items]]
  id = "title"
  type = "string"
  description = "Founder's title (e.g. CEO, CTO)"

  [[fields.items]]
  id = "start_year"
  type = "integer"
  description = "Year the founder started, if mentioned"

  [[fields.items]]
  id = "end_year"
  type = "integer"
  description = "Year the founder left, if mentioned"

[[fields]]
id = "team_size"
type = "integer"
required = false
description = "Total number of employees or team members"

[[fields]]
id = "key_advisors"
type = "text"
required = false
description = "A comma-separated list of key advisors or board members"

[[fields]]
id = "open_roles"
type = "text"
required = false
description = "A comma-separated list of key roles the company is looking to hire"

[[fields]]
id = "annual_revenue"
type = "currency"
required = false
description = "Most recent annual revenue figure"

[[fields]]
id = "arr"
type = "currency"
required = false
description = "Annual recurring revenue"

[[fields]]
id = "revenue_growth_percent"
type = "float"
required = false
description = "Revenue growth percentage"

[[fields]]
id = "revenue_year"
type = "integer"
required = false
description = "Year associated with revenue metrics"

[[fields]]
id = "patents_granted"
type = "integer"
required = false
description = "Number of granted patents, if explicitly stated"

[[fields]]
id = "ip_summary"
type = "text"
required = false
description = "Summary of the company's proprietary technology or intellectual property moat"

[[fields]]
id = "customer_quotes"
type = "text"
required = false
description = "A summary or list of notable customer quotes praising the product or service"


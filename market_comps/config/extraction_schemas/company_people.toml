name = "company_people"
version = "v1"

description = "Extract people associated with a specific company"

enabled = true
model_complexity = "easy"

[[fields]]
id = "company_name"
type = "string"
required = true
description = "The name of the company the person works for"

# ----------------------------------------------------------------------------

[[fields]]
id = "person_name"
type = "string"
required = true
description = "The full name of the person"

# ----------------------------------------------------------------------------

[[fields]]
id = "person_title"
type = "string"
required = false
description = "The job title or role of the person (e.g., Founder, CEO, Partner)"

# ----------------------------------------------------------------------------

[[fields]]
id = "email_address"
type = "string"
required = false
description = "The email address of the person"

# ----------------------------------------------------------------------------

[[fields]]
id = "linkedin_url"
type = "string"
required = false
description = "The LinkedIn URL of the person"

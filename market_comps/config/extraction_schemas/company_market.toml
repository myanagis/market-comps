name = "company_market"
version = "v1"

description = "Extract market sizing and competitive landscape details from a startup pitch deck"

enabled = true
model_complexity = "medium"

[[fields]]
id = "company_name"
type = "string"
required = true
description = "The name of the startup company"

# ----------------------------------------------------------------------------

[[fields]]
id = "target_market"
type = "string"
required = false
description = "A description of the company's target market or ideal customer profile"

# ----------------------------------------------------------------------------

[[fields]]
id = "tam_usd"
type = "currency"
required = false
description = "Total Addressable Market (TAM) size in USD, if mentioned"

# ----------------------------------------------------------------------------

[[fields]]
id = "sam_usd"
type = "currency"
required = false
description = "Serviceable Available Market (SAM) size in USD, if mentioned"

# ----------------------------------------------------------------------------

[[fields]]
id = "som_usd"
type = "currency"
required = false
description = "Serviceable Obtainable Market (SOM) size in USD, if mentioned"

# ----------------------------------------------------------------------------

[[fields]]
id = "competitors"
type = "text"
required = false
description = "A comma-separated list of key competitors mentioned in the document"

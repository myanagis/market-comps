# ============================================================================
# UNKNOWN / FALLBACK
# ============================================================================

[[classes]]

id = "unknown"

enabled = true

description = "Document could not confidently be classified"

recommended_schemas = []

optional_schemas = []

extraction_complexity = "easy"

auto_run_threshold = 1.00
human_review_threshold = 1.00

# ============================================================================
# REVENUE / FINANCIAL DOCUMENT
# ============================================================================

[[classes]]

id = "company_financial_document"

enabled = true

description = "Financial statements, KPI summaries, revenue reports, or operating metrics documents"

examples = [
  "Income statement",
  "Revenue summary",
  "Financial model",
  "Board financials",
  "Monthly KPI report"

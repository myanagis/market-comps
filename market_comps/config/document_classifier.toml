# ============================================================================
# DOCUMENT CLASSIFIER CONFIG
# ============================================================================
#
# Purpose:
# - Define document classes
# - Route documents to extraction schemas
# - Configure extraction behavior
# - Keep orchestration declarative and versioned
#
# Runtime classifier output should look like:
#
# {
#   "document_type": "startup_pitch_deck",
#   "confidence": 0.91,
#   "candidate_classes": [...]
# }
#
# ============================================================================

name = "document_classifier"
version = "v1"

description = "General-purpose document routing classifier"

enabled = true

allow_multiple_labels = true
allow_unknown = true

# ============================================================================
# STARTUP PITCH DECK
# ============================================================================

[[classes]]

id = "startup_pitch_deck"

enabled = true

description = "Investor fundraising presentation for a startup company"

examples = [
  "Series A investor presentation",
  "Seed fundraising deck",
  "Company pitch deck",
  "Investor update deck"
]

recommended_schemas = [
  "startup_company_overview",
  "startup_market",
  "startup_financials",
  "startup_fundraising",
  "startup_team",
  "company_revenue_metrics"
]

optional_schemas = [
  "startup_patents",
  "startup_customer_quotes"
]

extraction_complexity = "medium"

auto_run_threshold = 0.85
human_review_threshold = 0.60

# ============================================================================
# INVESTOR PORTFOLIO PAGE
# ============================================================================

[[classes]]

id = "investor_portfolio_page"

enabled = true

description = "Investor, accelerator, incubator, or venture portfolio page listing startups and related people"

examples = [
  "VC portfolio page",
  "Accelerator company list",
  "Startup cohort page",
  "Investment portfolio page",
  "Program participant directory"
]

recommended_schemas = [
  "portfolio_companies",
  "portfolio_people",
  "portfolio_emails",
  "portfolio_company_relationships",
  "program_memberships"
]

optional_schemas = [
  "company_industries",
  "company_locations",
  "company_funding_rounds"
]

extraction_complexity = "easy"

auto_run_threshold = 0.90
human_review_threshold = 0.70

# ============================================================================
# GENERAL COMPANY DUE DILIGENCE
# ============================================================================

[[classes]]

id = "company_due_diligence"

enabled = true

description = "General company diligence materials including memos, reports, research, financial analysis, and customer or market diligence"

examples = [
  "Investment memo",
  "Commercial diligence report",
  "Technical diligence document",
  "Customer diligence notes",
  "Market diligence report"
]

recommended_schemas = [
  "company_overview",
  "company_market",
  "company_competition",
  "company_management_team",
  "company_financials",
  "company_revenue_metrics",
  "company_risks",
  "company_customers"
]

optional_schemas = [
  "company_mna_activity",
  "company_public_comps",
  "company_ip",
  "company_regulatory"
]

extraction_complexity = "hard"

auto_run_threshold = 0.80
human_review_threshold = 0.55

